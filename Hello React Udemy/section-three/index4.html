<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- REACT LIBRARY -->
  <script src="https://unpkg.com/react@15.5.4/dist/react.js"></script>
  <!-- REACT DOM LIBRARY -->
  <script src="https://unpkg.com/react-dom@15.5.4/dist/react-dom.js"></script>
  <!-- BABEL LIBRARY -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.25.0/babel.min.js"></script>
  <title>Class Components</title>
</head>
<body>
    <div id="app">React didnt render yet</div>

    <script type="text/babel">
        // class Shapes extends React.Component{
        //     render(){
        //         return(
        //             <h1>circle, Rectangle, Square</h1>
        //         )
        //     }
        // }

        class CircleShape extends React.Component{
            render(){
                let circle= {
                    margin: 10,
                    padding: 10,
                    border: '1px solid',
                    background: 'rgb(255, 197, 197)'
                }
                return(
                    <svg style={circle} width="100" height="100" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="red" />
                     </svg>
                );
            }
        }

        class SquareShape extends React.Component{
            render(){
                return(
                    <svg className='square'  width="100" height="100" xmlns="http://www.w3.org/2000/svg">
                        <rect width="80" height="80" x="10" y="10" stroke="black" stroke-width="3" fill="blue" />
                    </svg>
                );
            }
        }

        class RectangleShape extends React.Component{
             render(){
                return(
                    <svg className='rectangle'  width="150" height="100" xmlns="http://www.w3.org/2000/svg">
                        <rect width="120" height="60" x="15" y="20" stroke="black" stroke-width="3" fill="green" />
                    </svg>
                );
            }
        }

        ReactDOM.render(
            <div>
                <CircleShape/>
                <SquareShape/>
                <RectangleShape/>
            </div>,
            document.getElementById("app")
        )
    </script>
</body>
</html>
