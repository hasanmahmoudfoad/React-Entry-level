<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- REACT LIBRARY -->
  <script src="https://unpkg.com/react@15.5.4/dist/react.js"></script>
  <!-- REACT DOM LIBRARY -->
  <script src="https://unpkg.com/react-dom@15.5.4/dist/react-dom.js"></script>
  <!-- BABEL LIBRARY -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.25.0/babel.min.js"></script>
  <link rel="stylesheet" href="./main.css">
  <title>Styling Components with react</title></head>
<body>
    <div id="app">React didnt render yet</div>

    <script type="text/babel">
     
     
        class RedText extends React.Component{
           
            render(){
                let redStyle = {
                    color: "white",
                    padding: 10,
                    backgroundColor: "red"
                }
                return(
                    <h1 style ={ redStyle } >Red</h1>
                );
            }
        }

        class BlueText extends React.Component{
            render(){
                let blueStyle= {
                    color : 'white',
                    padding: 10,
                    backgroundColor: 'blue'
                }
                return(
                    <h1 style = { blueStyle } >Blue</h1>
                );
            }
        }

        class GreenText extends React.Component{
             render(){
                let greenStyle = {
                    color: "white",
                    padding: 10,
                    backgroundColor: "green"
                }
                return(
                    <h1 style ={ greenStyle } >green</h1>
                );
            }
        }

        ReactDOM.render(
            <div>
                <RedText/>
                <BlueText/>
                <GreenText/>
            </div>,
            document.getElementById("app")
        )
    </script>
</body>
</html>
