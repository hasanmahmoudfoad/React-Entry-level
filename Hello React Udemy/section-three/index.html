<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- REACT LIBRARY -->
  <script src="https://unpkg.com/react@15.5.4/dist/react.js"></script>
  <!-- REACT DOM LIBRARY -->
  <script src="https://unpkg.com/react-dom@15.5.4/dist/react-dom.js"></script>
  <!-- BABEL LIBRARY -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.25.0/babel.min.js"></script>
  <link rel="stylesheet" href="./main.css">
  <title>Styling Components</title></head>
<body>
    <div id="app">React didnt render yet</div>

    <script type="text/babel">
     
        class CircleShape extends React.Component{
            render(){
                return(
                    <h1 className='red'>Red</h1>
                );
            }
        }

        class SquareShape extends React.Component{
            render(){
                return(
                    <h1 className='blue'>Blue</h1>
                );
            }
        }

        class RectangleShape extends React.Component{
             render(){
                return(
                    <h1 className='green'>green</h1>
                );
            }
        }

        ReactDOM.render(
            <div>
                <CircleShape/>
                <SquareShape/>
                <RectangleShape/>
            </div>,
            document.getElementById("app")
        )
    </script>
</body>
</html>
