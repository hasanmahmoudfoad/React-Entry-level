        function FamilyList(item) {
            
                return(
                    <div>
                        {
                            item.people.filter(function(person) {
                                return person.female;
                            }).map(function(person) {
                                return <div key={person.id}>{person.name}</div>
                            })
                        }
                    </div>
                );
        }





        ReactDOM.render(

            <FamilyList
                 people={people}
            />,

            document.getElementById('app')
        )        
    </script>
