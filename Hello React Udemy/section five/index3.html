<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- REACT LIBRARY -->
  <script src="https://unpkg.com/react@15.5.4/dist/react.js"></script>
  <!-- REACT DOM LIBRARY -->
  <script src="https://unpkg.com/react-dom@15.5.4/dist/react-dom.js"></script>
  <!-- BABEL LIBRARY -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.25.0/babel.min.js"></script>
  <title>Styling Components with react</title></head>
<body>
    <div id="app">React didnt render yet</div>

    <script type="text/babel">
     


        class TextWithBackgroundColor extends React.Component{
           
            render(){
                let redStyle = {
                    color: this.props.textColor,
                    padding: 10,
                    backgroundColor: this.props.color
                }
                return(
                    <h1 style ={ redStyle } >This Is {this.props.colorName} Color</h1>
                );
            }
        }

  

        ReactDOM.render(
            <div>
                <TextWithBackgroundColor textColor={'#fff'} color={'red'} colorName={'Red'}/>
                <TextWithBackgroundColor textColor={'brown'}  color={'#8fe056'} colorName={'Brown'}/>
                <TextWithBackgroundColor textColor={'navy'}  color={'grey'} colorName={'Navy'}/>
            </div>,
            document.getElementById("app")
        )
    </script>
</body>
</html>
