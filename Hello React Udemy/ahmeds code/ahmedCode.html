<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- REACT LIBRARY -->
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <!-- BABEL -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.25.0/babel.min.js"></script>
    <!-- BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>Dinner Vote</title>
  </head>

  <body>
    <div id="app">React has not rendered yet</div>

    <script type="text/babel">
      const DinnerVote = () => {
        const [meals, setMeals] = React.useState([
          {
            id: 0,
            vote: 0,
            meal: "Pizza",
            img: "https://img.freepik.com/free-photo/mushroom-pizza-with-tomato-sauce-served-round-bamboo-board_114579-1908.jpg?semt=ais_hybrid&w=740&q=80",
          },
          {
            id: 1,
            vote: 0,
            meal: "Burger",
            img: "https://img.freepik.com/free-vector/realistic-burger-chalkboard-background_79603-1042.jpg?semt=ais_hybrid&w=740&q=80",
          },
          {
            id: 2,
            vote: 0,
            meal: "Sea food",
            img: "https://img.freepik.com/free-photo/seafood-plate-with-fried-salmon-mussels-shrimps-calamari-lemon_140725-1613.jpg?semt=ais_hybrid&w=740&q=80",
          },
        ]);

        // Increase vote
        const addVote = (id) => {
          setMeals((prevMeals) =>
            prevMeals.map((meal) =>
              meal.id === id ? { ...meal, vote: meal.vote + 1 } : meal
            )
          );
        };

        // Decrease vote
        const subtractVote = (id) => {
          setMeals((prevMeals) =>
            prevMeals.map((meal) =>
              meal.id === id ? { ...meal, vote: meal.vote - 1 } : meal
            )
          );
        };

        return (
          <div className="row m-5">
            {meals.map((meal) => (
              <div key={meal.id} className="col-4">
                <div className="m-2 p-1 text-center border">
                  <img className="img-fluid p-2" src={meal.img} />
                  <h2>{meal.meal}</h2>

                  <div className="row p-3">
                    <p className="col-6">Vote if you want this</p>
                    <button
                      className="btn btn-success col-6"
                      onClick={() => addVote(meal.id)}
                    >
                      +1
                    </button>
                  </div>

                  <div className="row p-3">
                    <p className="col-6">Vote if you don't want this</p>
                    <button
                      className="btn btn-danger col-6"
                      onClick={() => subtractVote(meal.id)}
                    >
                      -1
                    </button>
                  </div>

                  <p>Total Votes: {meal.vote}</p>
                </div>
              </div>
            ))}
          </div>
        );
      };

      ReactDOM.render(<DinnerVote />, document.getElementById("app"));
    </script>
  </body>
</html>
