<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- REACT LIBRARY -->
  <script src="https://unpkg.com/react@15.5.4/dist/react.js"></script>
  <!-- REACT DOM LIBRARY -->
  <script src="https://unpkg.com/react-dom@15.5.4/dist/react-dom.js"></script>
  <!-- BABEL LIBRARY -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.25.0/babel.min.js"></script>
  <!-- BOOTSTRAP LIBRARY -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <title>Events part one</title>
</head>
<body>
    <div id="app">React has not rendered yet</div>

<script type="text/babel">

class Note extends React.Component{
    handleEventTouch(){
        alert('Ouch, thats hot!!')
    }
    handleEventDrink(){
        alert('Brain freeze!!')
    }

    render(){
        return(
            <div className='m-5'>
                <h1>Life Warnings</h1>
                <button onMouseEnter={this.handleEventTouch} className='m-2 btn btn-info'>Touch stove</button>
                <button onMouseEnter={this.handleEventDrink} className='m-2 btn btn-danger'>Drink Slurpee fast</button>
            </div>
        )
    }
}
 
    ReactDOM.render(
        <div>
            <Note />
        </div>,
        document.getElementById('app')
        )
</script>

</body>
</html>
